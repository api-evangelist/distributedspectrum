description: 'Distributed Spectrum, self-described as "The World''s First AI Signals Expert," builds edge-AI
  radio-frequency sensing technology that detects and identifies RF signals to autonomously map threats
  without expensive hardware or trained operators. Its sensors process data locally to deliver real-time
  alerts on threat types such as tactical radios, GPS jammers, and drones, and can be deployed anywhere
  using commercial components to form distributed detection networks. The company is headquartered at 99
  Madison Ave, New York, NY, raised a $25M Series A, and is a Felicis portfolio company. No public API
  or developer program is published at this time; this profile carries the identity and domain-security
  posture surfaced by the enrichment pipeline.'
